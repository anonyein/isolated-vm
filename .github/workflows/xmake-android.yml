name: Build Android (xmake)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.15.0
  ANDROID_NDK_VERSION: r29
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/7d0062b9e4e4fe1bd0084ce96354239c"
          - abi: x86_64
            triplet: x86_64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/c36d90e473694d96e422a823bd1148c7"

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build curl tar zstd libboost-all-dev

      - name: 准备独立的 Boost 头文件目录
        run: |
          mkdir -p /tmp/host-boost-headers
          cp -r /usr/include/boost /tmp/host-boost-headers/boost

      - name: 安装 xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5

      - name: 安装 npm 依赖并编译 TypeScript
        run: pnpm install --frozen-lockfile && npx tsc -b

      - name: 下载并配置 Android NDK
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME

      - name: 下载 Javet SO（可选）
        continue-on-error: true
        run: |
          npm i -g playwright && npx playwright install chromium
          cat > dl.cjs << 'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto(process.env.DOWNLOAD_URL, { waitUntil: 'networkidle' });
            const [download] = await Promise.all([ page.waitForEvent('download'), page.goto(process.env.DOWNLOAD_URL) ]);
            await download.saveAs('deps/javet/' + process.env.JAVET_SO_NAME);
            await browser.close();
          })();
          EOF
          mkdir -p deps/javet
          DOWNLOAD_URL="${{ matrix.download_url }}" JAVET_SO_NAME="${{ env.JAVET_SO_NAME }}" node dl.cjs

      - name: 下载 Node.js 头文件
        run: |
          mkdir -p deps/nodejs
          curl -fsSL "https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz" | tar -xz -C deps/nodejs --strip-components=1

      - name: 复制 Node 头文件到子包预期位置
        run: |
          mkdir -p packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/
          mkdir -p packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/

      - name: 准备 V8 头文件（补全缺失的 v8-gn.h）
        run: |
          touch deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h

      # 关键：源码修复
      - name: 修复源码（bits/stdc++.h 及 elide.cc）
        shell: bash
        run: |
          # 创建 bits/stdc++.h
          NDK_CXX_HEADERS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1"
          mkdir -p "${NDK_CXX_HEADERS}/bits"
          cat > "${NDK_CXX_HEADERS}/bits/stdc++.h" << 'STD_HEADER'
          #include <cstdlib>
          #include <cstdint>
          #include <cstddef>
          #include <cstring>
          #include <cwchar>
          #include <cstdio>
          #include <cassert>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <concepts>
          #include <condition_variable>
          #include <deque>
          #include <exception>
          #include <forward_list>
          #include <functional>
          #include <initializer_list>
          #include <iomanip>
          #include <iostream>
          #include <iterator>
          #include <limits>
          #include <list>
          #include <map>
          #include <memory>
          #include <mutex>
          #include <new>
          #include <numeric>
          #include <optional>
          #include <queue>
          #include <random>
          #include <ratio>
          #include <set>
          #include <shared_mutex>
          #include <span>
          #include <sstream>
          #include <stack>
          #include <stdexcept>
          #include <stop_token>
          #include <string>
          #include <string_view>
          #include <source_location>
          #include <tuple>
          #include <type_traits>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <variant>
          #include <vector>
          #include <cmath>
          #include <compare>
          #include <ranges>
          #include <bit>
          #include <version>
          STD_HEADER

          # 修复所有 .cc 文件：删除 import std; 并插入 bits/stdc++.h
          find packages -name '*.cc' -exec sed -i '/^import std;$/d' {} \;
          find packages -name '*.cc' -exec sed -i '/^#include <bits\/stdc++.h>$/d' {} \;
          for f in $(find packages -name '*.cc'); do 
              if grep -q 'module ' "$f"; then
                  sed -i '1i\module;' "$f"
                  sed -i '2i\#include <bits/stdc++.h>' "$f"
              else
                  sed -i '1i\#include <bits/stdc++.h>' "$f"
              fi
          done

          # 修复 elide.cc 的 GCC 扩展
          sed -i -E '/auto[[:space:]]*\[\.\.\.[[:space:]]*args[[:space:]]*\][[:space:]]*=[[:space:]]*std::move\(args_\);/d' packages/utility/functional/elide.cc

      - name: 配置 xmake
        run: |
          xmake f -p android --ndk=$ANDROID_NDK_HOME -a ${{ matrix.abi }} --ndk_api=${{ matrix.ndk_api }} -m release

      - name: 构建
        run: xmake build backend_napi_v8

      - name: 验证产物
        if: success()
        run: |
          ls -l build/android/${{ matrix.abi }}/release/libbackend_napi_v8.so
          file build/android/${{ matrix.abi }}/release/libbackend_napi_v8.so

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/android/${{ matrix.abi }}/release/libbackend_napi_v8.so
