name: Build Android (xmake)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.15.0
  ANDROID_NDK_VERSION: r29
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/7d0062b9e4e4fe1bd0084ce96354239c"
          - abi: x86_64
            triplet: x86_64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/c36d90e473694d96e422a823bd1148c7"

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y ninja-build curl tar zstd libboost-all-dev xxd

      - name: 准备独立的 Boost 头文件目录
        run: |
          mkdir -p /tmp/host-boost-headers
          cp -r /usr/include/boost /tmp/host-boost-headers/boost

      - name: 安装 xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5

      - name: 安装 npm 依赖并编译 TypeScript
        run: pnpm install --frozen-lockfile && npx tsc -b

      - name: 安装 Playwright 及浏览器
        run: |
          pnpm add -D -w playwright
          npx playwright install chromium

      - name: 下载 Javet SO (headless)
        continue-on-error: true
        run: |
          cat > download.cjs << 'SCRIPT_END'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const url = process.env.DOWNLOAD_URL;
            try {
              const [download] = await Promise.all([
                page.waitForEvent('download', { timeout: 60000 }),
                page.goto(url, { waitUntil: 'networkidle' })
              ]);
              await download.saveAs('deps/javet/' + process.env.JAVET_SO_NAME);
              console.log('下载成功');
            } catch (e) {
              console.error('下载失败，继续构建:', e.message);
            } finally {
              await browser.close();
            }
          })()
          SCRIPT_END
          mkdir -p deps/javet
          node download.cjs
        env:
          DOWNLOAD_URL: ${{ matrix.download_url }}
          JAVET_SO_NAME: ${{ env.JAVET_SO_NAME }}

      - name: 下载 Node.js 头文件（不复制到项目）
        run: |
          curl -fsSL "https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz" | tar -xz -C /tmp
          # 验证关键头文件存在
          test -f /tmp/node-v${{ env.NODE_HEADERS }}/src/node_api.h
          test -f /tmp/node-v${{ env.NODE_HEADERS }}/deps/v8/include/v8.h

      - name: 下载并配置 Android NDK (r29)
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME

      - name: 修复源码（bits/stdc++.h 及模块结构）
        shell: bash
        run: |
          NDK_CXX_HEADERS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1"
          mkdir -p "${NDK_CXX_HEADERS}/bits"
          cat > "${NDK_CXX_HEADERS}/bits/stdc++.h" << 'STD_HEADER'
          #include <cstdlib>
          #include <cstdint>
          #include <cstddef>
          #include <cstring>
          #include <cwchar>
          #include <cstdio>
          #include <cassert>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <concepts>
          #include <condition_variable>
          #include <deque>
          #include <exception>
          #include <forward_list>
          #include <functional>
          #include <initializer_list>
          #include <iomanip>
          #include <iostream>
          #include <iterator>
          #include <limits>
          #include <list>
          #include <map>
          #include <memory>
          #include <mutex>
          #include <new>
          #include <numeric>
          #include <optional>
          #include <queue>
          #include <random>
          #include <ratio>
          #include <set>
          #include <shared_mutex>
          #include <span>
          #include <sstream>
          #include <stack>
          #include <stdexcept>
          #include <stop_token>
          #include <string>
          #include <string_view>
          #include <source_location>
          #include <tuple>
          #include <type_traits>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <variant>
          #include <vector>
          #include <cmath>
          #include <compare>
          #include <ranges>
          #include <bit>
          #include <version>
          STD_HEADER

          # 删除所有 import std; 行
          find packages -name '*.cc' -exec sed -i '/^import std;$/d' {} \;

          # 处理所有包含 'module ' 的文件
          for f in $(grep -rlP '(?:export\s+)?module\s' packages/); do
            sed -i '/^#include <bits\/stdc++.h>$/d' "$f"
            sed -i '/^module;$/d' "$f"
            if ! grep -q '^module;$' "$f"; then
              sed -i '1i\module;' "$f"
              sed -i '2i\#include <bits/stdc++.h>' "$f"
            fi
          done

          # 非模块文件插入 include
          for f in $(find packages -name '*.cc' -exec grep -LP '(?:export\s+)?module\s' {} \;); do
            sed -i '/^#include <bits\/stdc++.h>$/d' "$f"
            sed -i '1i\#include <bits/stdc++.h>' "$f"
          done

          # 修复 elide.cc
          sed -i -E '/auto[[:space:]]*\[\.\.\.[[:space:]]*args[[:space:]]*\][[:space:]]*=[[:space:]]*std::move\(args_\);/d' packages/utility/functional/elide.cc
          sed -i 's/std::move(args)\.\.\./std::forward<Args>(args_).../g' packages/utility/functional/elide.cc

      - name: 生成 runtime_dist_interface_js.h（灵活查找）
        shell: bash
        run: |
          mkdir -p packages/backend_napi_v8/runtime
          # 1. 尝试获取 auto_js_cmake_include 的输出目录
          INCLUDE_DIR=$(npx auto_js_cmake_include 2>/dev/null || true)
          echo "auto_js_cmake_include 输出: $INCLUDE_DIR"
          if [ -n "$INCLUDE_DIR" ] && [ -d "$INCLUDE_DIR" ]; then
            if [ -f "$INCLUDE_DIR/runtime_dist_interface_js.h" ]; then
              cp "$INCLUDE_DIR/runtime_dist_interface_js.h" packages/backend_napi_v8/runtime/
              echo "已从 $INCLUDE_DIR 复制头文件"
              exit 0
            fi
          fi
          # 2. 全局搜索已生成的头文件
          FOUND=$(find . -name runtime_dist_interface_js.h -print -quit)
          if [ -n "$FOUND" ]; then
            echo "找到已存在的头文件: $FOUND"
            cp "$FOUND" packages/backend_napi_v8/runtime/
            exit 0
          fi
          # 3. 使用 interface.js 生成（避免自我复制）
          JS_FILE="packages/backend_napi_v8/runtime/dist/interface.js"
          if [ -f "$JS_FILE" ]; then
            echo "使用 $JS_FILE 生成头文件"
            xxd -i "$JS_FILE" packages/backend_napi_v8/runtime/runtime_dist_interface_js.h
            sed -i 's/^unsigned char .*runtime_dist_interface_js/unsigned char runtime_dist_interface_js/' packages/backend_napi_v8/runtime/runtime_dist_interface_js.h
            sed -i 's/^unsigned int .*runtime_dist_interface_js_len/unsigned int runtime_dist_interface_js_len/' packages/backend_napi_v8/runtime/runtime_dist_interface_js.h
          else
            # 4. 最终回退：空占位
            echo "错误：无法找到 interface.js，创建占位头文件"
            cat > packages/backend_napi_v8/runtime/runtime_dist_interface_js.h << 'EOF'
          #ifndef RUNTIME_DIST_INTERFACE_JS_H
          #define RUNTIME_DIST_INTERFACE_JS_H
          static const unsigned char runtime_dist_interface_js[] = {};
          static const unsigned int runtime_dist_interface_js_len = 0;
          #endif
          EOF
          fi
        
      - name: 删除所有软链接（防止模块扫描误入 node_modules）
        run: find . -type l -delete

      - name: 配置 xmake
        run: xmake f -p android --ndk=$ANDROID_NDK_HOME -a ${{ matrix.abi }} -m release
        
      - name: 构建
        run: xmake build -v backend_napi_v8

      - name: 验证产物
        if: success()
        run: |
          find build -name "backend_napi_v8.node" -o -name "libbackend_napi_v8.so" | xargs ls -lh

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/**/libbackend_napi_v8.so
          if-no-files-found: error
