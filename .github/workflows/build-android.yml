name: Build Android (Javet-linked)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.0.0
  ANDROID_NDK_VERSION: r26d
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
            download_url: "https://ykj-eos-dg5-01.eos-dongguan-6.cmecloud.cn/7a058079c2ff4b53b12ff7c16622b247086?response-content-disposition=attachment%3B%20filename%2A%3DUTF-8%27%27libjavet-node-android-i18n.v.5.0.7.so&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20260508T132635Z&X-Amz-SignedHeaders=host&X-Amz-Expires=900&X-Amz-Credential=9T1UKBIX6OJSR5XN2F2T%2F20260508%2Fdefault%2Fs3%2Faws4_request&t=2&u=1040012775810652729&ot=personal&oi=1040012775810652729&f=Fj6biMQ4swk5CeLIVm0dO8JoESSBALNdO&ext=eyJ1dCI6MX0%3D&X-Amz-Signature=61677ebfcdb90120463a489236a9359aa9ac2e8989e5a40ef01d08460c2f997d"
          - abi: x86
            triplet: i686-linux-android
            ndk_api: 24
            download_url: "https://ykj-eos-dg5-01.eos-dongguan-6.cmecloud.cn/5b7c362ac0bc4dffa5ac26c3772e2a62086?response-content-disposition=attachment%3B%20filename%2A%3DUTF-8%27%27libjavet-node-android-i18n.v.5.0.7_20260508_211947.so&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20260508T133102Z&X-Amz-SignedHeaders=host&X-Amz-Expires=900&X-Amz-Credential=9T1UKBIX6OJSR5XN2F2T%2F20260508%2Fdefault%2Fs3%2Faws4_request&t=2&u=1040012775810652729&ot=personal&oi=1040012775810652729&f=FlbHSroTtUUiF76zJPg9AUIATeb_K7URI&ext=eyJ1dCI6MX0%3D&X-Amz-Signature=d66a7711bc76daa54fd399f81880be844a9f7775013d53b1a881600b3b0da8b5"

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl tar zstd

      - name: 安装 CMake 4.0.0
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.0.0/cmake-4.0.0-linux-x86_64.sh -o cmake.sh
          sudo bash cmake.sh --prefix=/usr/local --skip-license
          cmake --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: 安装 npm 依赖并编译 TypeScript
        run: |
          pnpm install --frozen-lockfile
          npx tsc -b

      - name: 下载并配置 Android NDK
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: 下载 Javet SO (headless)
        run: |
          npx playwright install chromium
          node -e "
            const { chromium } = require('playwright');
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage();
              const url = '${{ matrix.download_url }}';
              const [download] = await Promise.all([
                page.waitForEvent('download'),
                page.goto(url, { waitUntil: 'networkidle' })
              ]);
              await download.saveAs('deps/javet/${{ env.JAVET_SO_NAME }}');
              await browser.close();
            })()
        env:
          DOWNLOAD_URL: ${{ matrix.download_url }}

      # - name: 下载 Javet V8 库
      #   run: |
      #     mkdir -p deps/javet
      #     echo "下载 ${{ matrix.abi }} 架构的 Javet SO..."
      #     curl -L --retry 3 -o "deps/javet/${{ env.JAVET_SO_NAME }}" "${{ matrix.download_url }}"
      #     file "deps/javet/${{ env.JAVET_SO_NAME }}"

      - name: 下载 Node.js 头文件
        run: |
          if [ -f scripts/nodejs_select ]; then
            bash scripts/nodejs_select "deps/nodejs/${{ env.NODE_HEADERS }}"
          else
            mkdir -p deps/nodejs
            curl -fsSL https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz | tar -xz -C deps/nodejs --strip-components=1
          fi

      - name: 配置 CMake
        shell: bash
        run: |
          cat > ./custom.android.toolchain.cmake << 'EOF'
          include($ENV{ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake)
          set(CMAKE_LINKER_TYPE DEFAULT)
          set(ANDROID_STL c++_shared)
          EOF

          export TOOLCHAIN_FILE=./custom.android.toolchain.cmake
          cmake \
            -DCMAKE_MODULE_PATH=$(npm exec auto_js_cmake_include) \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.ndk_api }}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DV8_LIBRARY_TYPE=shared \
            -DV8_INCLUDE_DIR="$PWD/deps/v8/include" \
            -DV8_SHARED_LIBRARY="$PWD/deps/javet/${{ env.JAVET_SO_NAME }}" \
            -DV8_LIBRARY_PATH="$PWD/deps/javet" \
            -DNODE_DIST_DIR="deps/nodejs/${{ env.NODE_HEADERS }}" \
            -DIVM_INSTALL=copy \
            -B build \
            -G Ninja

      - name: 构建
        run: ninja -C build backend_napi_v8

      - name: 验证产物
        run: |
          ls -lh build/packages/backend_napi_v8/
          file build/packages/backend_napi_v8/backend_napi_v8.node

      - uses: actions/upload-artifact@v6
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/packages/backend_napi_v8/artifacts
          if-no-files-found: error
