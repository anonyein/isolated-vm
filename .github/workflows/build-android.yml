name: Build Android (Javet node .so)

# Cross-compiles `backend_napi_v8.node` for Android, linking against Javet's
# monolithic Node .so (which bundles V8 + libbase + libplatform + icu).
#
# Key design decisions (see investigation notes in PR / chat):
#  * Toolchain: standalone LLVM (C++26 + `import std` capable) as the compiler,
#    with the NDK only providing the sysroot (Android libc, system libs, and
#    libc++_shared). NDK's own clang (18) can neither compile the C++26 syntax
#    nor supply an `import std` module, which is why every hand-patched attempt
#    with `sed`/manual module compilation was unsustainable.
#  * Modules: CMake 4.0 performs C++20 module scanning/ordering natively. No
#    manual PCM compilation, no `bits/stdc++.h`, no source rewriting.
#  * `import std`: we hand-build a libc++ `std` module against the NDK's libc++
#    headers and point CMake at it via CMAKE_CXX_STDLIB_MODULES_JSON, mirroring
#    the ECO_STD mechanism used for Windows/macOS in build-test-release.yml.
#  * V8 ABI: Javet's *node* .so follows Node's defaults -> pointer compression
#    OFF, sandbox OFF, direct-handle OFF. An empty v8-gn.h (all macros undefined)
#    is therefore the correct ABI configuration.
#  * V8_TRICKSHOT is emptied so symbols stay in the real `v8::` namespace
#    (default `blam` renames v8 -> y8 and would never resolve against Javet).
#  * third_party/v8/CMakeLists.txt shared branch links a single library via
#    -DV8_SHARED_LIBS instead of the 4 split GN libraries.

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_VERSION: 5.0.10
  NODE_HEADERS: 24.18.0
  # Standalone LLVM release used as the cross compiler. Must support C++26 and
  # ship std.cppm + libc++.modules.json.
  #
  # Pinned to 22.1.0 to match the libc++ headers (see the header switch below):
  # clang 22 parses libc++ 22's <optional>/<type_traits> during module BMI
  # emission without the ICEs seen when clang 22 was fed the NDK's libc++ 18
  # headers. We deliberately do NOT pass -fno-modules-reduced-bmi: the upstream
  # (and successful) build uses the default reduced BMI, and forcing full BMI
  # triggers a clang ASTReader lazy-specialization crash
  # (LoadExternalSpecializations) when an importer pulls a trait specialization
  # such as is_trivially_move_constructible<source_origin> out of a dependency
  # BMI. Reduced BMI keeps those specializations out of the BMI so importers
  # re-instantiate them locally instead.
  #
  # Back to 22 (apt.llvm.org release channel): we originally bumped to the 23
  # trunk snapshot to dodge clang 22's ASTWriter::GenerateNameLookupTable /
  # getLookupVisibility crash on the module_/reference interface BMIs (llvm
  # #161215), but that crash is now eliminated at the source level (all six
  # backend export-handle partitions were moved to plain headers, and
  # struct_template stores a util::flat_tuple instead of libc++ std::tuple).
  # clang 23 (trunk) instead segfaults in libc++'s NEW std::expected
  # tail-padding probe (__allow_reusing_expected_tail_padding / __x /
  # __fits_in_tail_padding, tuple:555) which clang 22's libc++ does not have.
  # So 22 is now the better target for this codebase.
  LLVM_VERSION: "23.0.0"
  # NDK that provides the Android sysroot / libc++_shared. libc++ is 18.x here;
  # ABI-stable against the LLVM_VERSION headers we compile with.
  ANDROID_NDK_VERSION: r27c
  ANDROID_API: "24"

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
          - abi: x86_64
            triplet: x86_64-linux-android
            # DIAGNOSTIC ONLY: override the compiler target triple to a plain
            # linux-gnu triple (keeping EVERYTHING else identical: clang-23, the
            # assembled libc++ headers, NDK sysroot, __ndk1 ABI, all flags). The
            # realloc()/ASTReader crash happens during BMI emission (frontend),
            # which is decided by the target triple's ABI/predefined macros, not
            # by sysroot libs. If the .cc.o compile gets PAST the crash (link will
            # fail later, we don't care), the -android target is the trigger. If
            # it still crashes, clang-23 itself is at fault, independent of Android.
            diag_triple: x86_64-unknown-linux-gnu

    env:
      ABI: ${{ matrix.abi }}
      TRIPLET: ${{ matrix.triplet }}
      # DIAGNOSTIC ONLY (empty for the real arm64 build): when set, the compiler
      # target triple is overridden to this value while sysroot/libc++/flags stay
      # identical. Used to isolate whether the -android target triggers the
      # clang ASTReader realloc crash.
      DIAG_TRIPLE: ${{ matrix.diag_triple }}
      JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.10.so

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: System dependencies
        run: |
          sudo apt-get update
          # xxd is required by embed.sh (embeds runtime/dist/interface.js into a C blob)
          sudo apt-get install -y ninja-build curl xz-utils p7zip-full libboost-all-dev xxd

      # Boost headers only (isolated-vm uses Boost header-only); expose them to
      # the cross build without dragging in host libraries.
      - name: Stage Boost headers
        run: |
          mkdir -p /tmp/boost-headers
          cp -r /usr/include/boost /tmp/boost-headers/boost

      # CMake 4.3.x is REQUIRED (not 4.0.x): the project's root CMakeLists.txt
      # selects the `import std` experimental UUID by CMake version --
      #   >= 4.3.0 -> 451f2fe2-a8a2-47c3-bc32-94786d8fc91b
      #   otherwise -> d0edc3af-... (the CMake 3.30-era value)
      # CMake 4.0.0 actually expects a DIFFERENT UUID (a9e1cf81-...), so with
      # 4.0.0 the project emits d0edc3af, the gate rejects it, __CMAKE::CXX26 is
      # never created, and every CXX_MODULE_STD target errors out. 4.3.3's
      # expected UUID matches the project's >=4.3.0 branch exactly.
      - name: Install CMake 4.3.3
        run: |
          set -eux
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.3.3/cmake-4.3.3-linux-x86_64.tar.gz -o cmake.tgz
          sudo tar -xf cmake.tgz -C /usr/local --strip-components=1
          cmake --version

      # Standalone LLVM: the compiler. Provides clang++ with C++26 support and,
      # crucially, libc++ std.cppm + libc++.modules.json for `import std`.
      - name: Install LLVM ${{ env.LLVM_VERSION }} (distro packages from apt.llvm.org)
        run: |
          set -eux
          # Use apt.llvm.org's clang-22 packages rather than the vanilla
          # LLVM-x.y.z-Linux-X64.tar.xz release. The vanilla release binaries crash
          # (clang frontend segfault / "SmallVector unable to grow" in
          # ASTReader::LoadExternalSpecializations) while emitting the BMI for the
          # backend_napi_v8 interface partitions that instantiate std::tuple/optional/
          # array of project reflection types (llvm #165348, still open upstream).
          # The distro packages carry backported serialization fixes and are exactly
          # what the upstream (non-Android) build uses successfully on Debian/Alpine.
          LLVM_MAJOR="${LLVM_VERSION%%.*}"
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR" all
          LLVM_DIR="/usr/lib/llvm-${LLVM_MAJOR}"
          test -x "$LLVM_DIR/bin/clang++" || { echo "ERROR: $LLVM_DIR/bin/clang++ missing after apt install" >&2; ls -la /usr/lib | grep llvm || true; exit 1; }
          echo "LLVM_DIR=$LLVM_DIR" >> "$GITHUB_ENV"
          "$LLVM_DIR/bin/clang++" --version

          # Locate the bundled libc++ headers. Because we cross-compile to Android
          # with the NDK sysroot, we force LLVM 22's own libc++ headers via
          # -nostdinc++ + -isystem (the NDK's libc++ 18 headers crash clang 22's
          # BMI machinery). libc++ headers come in TWO parts:
          #   - the generic tree      include/c++/v1/         (has <version>, __config)
          #   - a per-target config   include/<triple>/c++/v1/__config_site
          # __config is `#include <__config_site>`, and __config_site is generated
          # per build config and lives ONLY in the per-target dir. With -nostdinc++
          # clang no longer adds the per-target dir automatically, so we must feed
          # BOTH dirs via -isystem (config-site dir first). Verify a probe including
          # <version> defines _LIBCPP_VERSION -- exactly what CMake checks during
          # enable_language(CXX); if it fails there import std is declared unsupported.
          LIBCXX_INC=""
          for cand in "$LLVM_DIR/include/c++/v1" "$LLVM_DIR"/include/*/c++/v1; do
            if [ -f "$cand/version" ]; then LIBCXX_INC="$cand"; break; fi
          done
          ORIG_SITE=""
          for cand in \
            "$LLVM_DIR"/include/*/c++/v1 \
            "$LLVM_DIR/include/c++/v1"; do
            if [ -f "$cand/__config_site" ]; then ORIG_SITE="$cand/__config_site"; break; fi
          done
          test -n "$LIBCXX_INC" || { echo "ERROR: no bundled libc++ <version> header" >&2; find "$LLVM_DIR/include" -maxdepth 4 -name version 2>/dev/null; exit 1; }
          test -n "$ORIG_SITE" || { echo "ERROR: no bundled libc++ __config_site" >&2; find "$LLVM_DIR/include" -maxdepth 4 -name __config_site 2>/dev/null; exit 1; }
          echo "libc++ headers: $LIBCXX_INC ; original config-site: $ORIG_SITE"

          # Use the bundled __config_site UNCHANGED (standard __1 ABI namespace).
          #
          # DIAGNOSTIC EXPERIMENT: previously we rewrote this to force
          # _LIBCPP_ABI_NAMESPACE=__ndk1 so std:: symbols would match the Javet
          # .so (linked against the NDK's libc++_shared / std::__ndk1::). But that
          # non-standard inline namespace, combined with clang's C++20-module BMI
          # name-lookup-table serialization, deterministically crashes
          # (ASTWriter::GenerateNameLookupTable / infinite redecl-chain recursion,
          # llvm #161215 family) on the two largest importer partitions
          # (module_/reference). The upstream Linux/Win/mac builds never hit this
          # because they use the standard __1 ABI. So we drop the __ndk1 rewrite to
          # confirm the crash is caused by the non-standard ABI namespace; the
          # std<->Javet ABI bridge (if the theory holds) becomes a link-time
          # concern to solve separately.
          LIBCXX_SITE=/tmp/libcxx-site/c++/v1
          mkdir -p "$LIBCXX_SITE"
          cp "$ORIG_SITE" "$LIBCXX_SITE/__config_site"
          echo "--- __config_site (standard, unmodified) ---"; cat "$LIBCXX_SITE/__config_site"

          # Probe: -isystem the site FIRST, then the generic tree. Confirm
          # _LIBCPP_VERSION is defined (what CMake checks at enable_language(CXX)).
          printf '#include <version>\n#ifndef _LIBCPP_VERSION\n#error not libc++\n#endif\n#include <string>\nauto s = std::string{};\nint main(){return 0;}\n' > /tmp/libcxx_probe.cc
          "$LLVM_DIR/bin/clang++" -nostdinc++ -isystem "$LIBCXX_SITE" -isystem "$LIBCXX_INC" \
            --target=x86_64-unknown-linux-gnu -std=c++26 -fsyntax-only /tmp/libcxx_probe.cc
          echo "LIBCXX_INC=$LIBCXX_INC" >> "$GITHUB_ENV"
          echo "LIBCXX_SITE=$LIBCXX_SITE" >> "$GITHUB_ENV"

      - name: Setup Android NDK
        run: |
          set -eux
          NDK_ROOT=/tmp/android-ndk
          mkdir -p "$NDK_ROOT"
          curl -fsSL "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* "$NDK_ROOT"
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"

      # The standalone LLVM only ships host (x86_64-linux-gnu) compiler-rt and
      # libunwind. Cross-linking for Android needs the Android builtins
      # (libclang_rt.builtins) and libunwind, which the NDK provides. Copy the
      # NDK's copies into the exact resource-dir path clang 20 searches, for
      # each ABI. compiler-rt/libunwind ABIs are stable across these minor LLVM
      # versions, so NDK's (LLVM 18) archives link fine with LLVM 20 codegen.
      - name: Supply Android compiler-rt / libunwind to standalone LLVM
        run: |
          set -eux
          NDK_LLVM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          NDK_RT="${NDK_LLVM}/lib/clang/18/lib/linux"

          # clang 20 reports where it looks for builtins per target.
          for pair in "aarch64-linux-android24:aarch64:aarch64-unknown-linux-android24" \
                      "x86_64-linux-android24:x86_64:x86_64-unknown-linux-android24"; do
            TRIPLE="${pair%%:*}"; rest="${pair#*:}"
            ARCH="${rest%%:*}"; RTDIR_NAME="${rest#*:}"

            # Path clang 20 wants: <resource>/lib/<triple-normalized>/libclang_rt.builtins.a
            RES_DIR="$("${LLVM_DIR}/bin/clang" --target="${TRIPLE}" -print-resource-dir)"
            DEST="${RES_DIR}/lib/${RTDIR_NAME}"
            # /usr/lib/llvm-22 (apt distro package) is root-owned, so these
            # writes need sudo (the old /opt/llvm tarball dir happened to be
            # writable by the runner user).
            sudo mkdir -p "${DEST}"
            sudo cp "${NDK_RT}/libclang_rt.builtins-${ARCH}-android.a" "${DEST}/libclang_rt.builtins.a"

            # libunwind.a: clang looks for `-l:libunwind.a` on the library path.
            # Stage it next to the builtins and also expose the arch dir.
            sudo cp "${NDK_RT}/${ARCH}/libunwind.a" "${DEST}/libunwind.a"
            echo "Staged runtime for ${TRIPLE} -> ${DEST}"
            ls -l "${DEST}"
          done

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5

      - name: Install npm deps and build TypeScript
        run: |
          set -eux
          echo "$GITHUB_WORKSPACE/packages/auto_js/js/cmake" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile
          npx tsc -b

      # Headers only: `scripts/nodejs_select` also fetches Windows node.lib files
      # we don't need for an Android cross build, so fetch the headers tarball
      # directly.
      - name: Download Node.js headers
        run: |
          set -eux
          mkdir -p "deps/nodejs/${NODE_HEADERS}"
          curl -fsSL "https://nodejs.org/download/release/v${NODE_HEADERS}/node-v${NODE_HEADERS}-headers.tar.gz" | \
            tar xz --strip-components=1 -C "deps/nodejs/${NODE_HEADERS}"
          test -f "deps/nodejs/${NODE_HEADERS}/include/node/v8.h"

      # Javet's node .so is monolithic; Node headers do not ship v8-gn.h. The
      # ABI macros it would carry (pointer compression / sandbox / direct-handle)
      # are all OFF for a stock Node build, so an empty file is the correct and
      # complete ABI configuration.
      - name: Create empty v8-gn.h
        run: |
          set -eux
          echo "#pragma once" > "deps/nodejs/${NODE_HEADERS}/include/node/v8-gn.h"

      # Unpack the Javet .so from the tracked 7z archive and expose it to the
      # linker under a `-l`-friendly name. The real file keeps its SONAME
      # (libjavet-node-android-i18n.v.5.0.10.so), which is what gets recorded as
      # DT_NEEDED, so a plain `libjavet.so` symlink is only used at link time.
      - name: Unpack and stage Javet .so
        run: |
          set -eux
          7z x libs.7z -olibs -y
          case "$ABI" in
            arm64-v8a) SRC="libs/arm64-v8a/${JAVET_SO_NAME}" ;;
            x86_64)    SRC="libs/x86_64/${JAVET_SO_NAME}" ;;
          esac
          test -f "$SRC"
          mkdir -p deps/javet
          cp "$SRC" "deps/javet/${JAVET_SO_NAME}"
          ln -sf "${JAVET_SO_NAME}" "deps/javet/libjavet.so"
          ls -l deps/javet

      # `import std` support.
      #
      # We now compile against the standalone LLVM 22's OWN libc++ headers (see the
      # toolchain step for why: the NDK's libc++ 18 headers crash clang 22's
      # module/BMI machinery). That means we can also use LLVM 22's OWN bundled
      # std module -- std.cppm + libc++.modules.json ship in the tarball under
      # lib/<host-triple>/. Its `export using std::x;` list matches the v22 headers
      # exactly, so none of the earlier libc++-18 workarounds (fetching libcxx
      # source, expanding @LIBCXX_MODULE_STD_INCLUDE_SOURCES@, stripping C++26
      # saturation names) are needed.
      #
      # How CMake 4.x finds it (Compiler/Clang-CXX-CXXImportStd.cmake): it runs a
      # BARE probe with NO --target:
      #     clang++ -print-file-name=libc++.modules.json
      # and requires the returned path to EXIST. Since we use the host libc++
      # headers, the standalone LLVM's own host json is exactly right and already
      # sits where the bare probe resolves. We just verify it is there.
      #
      # ABI note: the module is compiled at configure time with the same CXX flags
      # as everything else, including -D_LIBCPP_ABI_NAMESPACE=__ndk1, so the `std`
      # module lands in the __ndk1 namespace to match the Javet .so runtime.
      - name: Prepare `import std` module manifest
        id: import_std
        run: |
          set -eux
          # Debian's libc++.modules.json (apt.llvm.org) uses RELATIVE source-paths
          # ("../share/libc++/v1/std.cppm") interpreted from the json's own dir. But
          # clang's -print-file-name returns the json at /lib/x86_64-linux-gnu/, where
          # ../share/... does NOT exist -- the real sources live under
          # /usr/lib/llvm-22/share/libc++/v1/. So CMake's default probe finds a json
          # whose std.cppm path is broken ("No SOURCES given to __cmake_cxx_std_26").
          # Fix: locate the actual std.cppm, then emit a corrected json with ABSOLUTE
          # source-paths and hand it to CMake via CMAKE_CXX_STDLIB_MODULES_JSON (the
          # same knob the upstream macOS build uses via ECO_STD).
          STD_CPPM="$(find "$LLVM_DIR" -name 'std.cppm' 2>/dev/null | head -n1)"
          test -n "$STD_CPPM" || { echo "ERROR: std.cppm not found under $LLVM_DIR" >&2; exit 1; }
          STD_DIR="$(dirname "$STD_CPPM")"
          echo "std module sources dir: ${STD_DIR}"
          ls -l "${STD_DIR}"
          ORIG_JSON="$("${LLVM_DIR}/bin/clang++" -print-file-name=libc++.modules.json)"
          test -f "$ORIG_JSON" || { echo "ERROR: no libc++.modules.json" >&2; exit 1; }
          echo "--- original modules.json ---"; cat "$ORIG_JSON"
          # Rewrite every "../..." source-path to an absolute path under STD_DIR.
          FIXED_JSON=/tmp/libcxx.modules.json
          sed -E "s#\"source-path\"[[:space:]]*:[[:space:]]*\"[^\"]*/([^/\"]+\.cppm)\"#\"source-path\": \"${STD_DIR}/\\1\"#g" \
            "$ORIG_JSON" > "$FIXED_JSON"
          echo "--- fixed modules.json ---"; cat "$FIXED_JSON"
          # Sanity: every referenced source must now exist.
          for f in $(grep -oE '"source-path"[^,]*' "$FIXED_JSON" | sed -E 's/.*"([^"]+)".*/\1/'); do
            test -f "$f" || { echo "ERROR: referenced module source missing: $f" >&2; exit 1; }
          done
          echo "STDLIB_MODULES_JSON=${FIXED_JSON}" >> "$GITHUB_ENV"
          echo "json=${FIXED_JSON}" >> "$GITHUB_OUTPUT"

      # Custom toolchain: standalone clang as compiler, NDK as sysroot only.
      - name: Write Android toolchain file
        run: |
          set -eux
          # Generic Linux cross-compile driven entirely by an explicit
          # --target=<triplet><api> triple. We deliberately do NOT use
          # CMAKE_SYSTEM_NAME=Android: that engages CMake's built-in NDK layout
          # assumptions, which don't hold for a standalone (non-NDK) clang. With
          # SYSTEM_NAME=Linux the project's `if(LINUX)` paths (e.g. --gc-sections)
          # stay active, while the clang driver still keys off the android triple
          # to define __ANDROID__ / V8_OS_ANDROID and pick the Android ABI.
          cat > /tmp/android-standalone.toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${ABI})

          set(_ndk "\$ENV{ANDROID_NDK_HOME}")
          set(_sysroot "\${_ndk}/toolchains/llvm/prebuilt/linux-x86_64/sysroot")
          set(_llvm "\$ENV{LLVM_DIR}")
          # DIAG_TRIPLE (diagnostic only): if set, use it verbatim as the compiler
          # target (no API suffix) to isolate the -android target as the crash
          # trigger. Empty for the real Android build -> normal <triplet><api>.
          if("\$ENV{DIAG_TRIPLE}" STREQUAL "")
            set(_triple ${TRIPLET}${ANDROID_API})
          else()
            set(_triple \$ENV{DIAG_TRIPLE})
          endif()

          set(CMAKE_C_COMPILER "\${_llvm}/bin/clang")
          set(CMAKE_CXX_COMPILER "\${_llvm}/bin/clang++")
          set(CMAKE_C_COMPILER_TARGET "\${_triple}")
          set(CMAKE_CXX_COMPILER_TARGET "\${_triple}")
          # DIAG mode: use the HOST glibc sysroot (not the android NDK sysroot) so
          # a linux-gnu target can actually link the compiler-sanity test and reach
          # the backend BMI compile. Real android build keeps the NDK sysroot.
          if("\$ENV{DIAG_TRIPLE}" STREQUAL "")
            set(CMAKE_SYSROOT "\${_sysroot}")
          endif()

          # libc++ HEADERS come from the standalone LLVM (v22), NOT the NDK (v18).
          # Rationale: the exact same sources build cleanly on normal platforms with
          # clang 22 + its own libc++ 22 headers, but crash the clang 22 frontend
          # here (segfault in TransformTypeTraitExpr while instantiating e.g.
          # std::optional<T>/std::expected<T> for a T imported from another module,
          # during BMI emission) when fed the NDK's libc++ 18 headers. clang 22's
          # module/BMI machinery is co-designed with libc++ 22's type_traits; the
          # older libc++ 18 headers trip it. So we use LLVM 22's libc++ headers via
          # -nostdinc++ + -isystem <llvm>/include/c++/v1.
          #
          # ABI: we still LINK against the NDK's libc++_shared.so (that is what the
          # Javet .so was built with, __ndk1 namespace, _LIBCPP_ABI_VERSION 1). To
          # keep symbol names and object layouts compatible we force the same ABI
          # knobs on the libc++ 22 headers: _LIBCPP_ABI_NAMESPACE=__ndk1 (matches the
          # runtime's mangled std:: names so we link against Javet's V8 C++ API which
          # passes std::unique_ptr<BackingStore> etc.) and _LIBCPP_ABI_VERSION=1
          # (the stable ABI: std:: layouts are guaranteed identical across libc++ 18
          # and 22 under v1). libc++_shared.so lives at
          #   <sysroot>/usr/lib/<triplet>/libc++_shared.so
          #
          # CRITICAL: -stdlib=libc++ must reach CMake's compiler-detection
          # try-compiles, NOT just the real targets. `import std` support is
          # decided during enable_language(CXX) (the project() call): CMake
          # compiles a probe and inspects CMAKE_CXX_STANDARD_LIBRARY. With plain
          # add_compile_options the probe runs against the standalone clang's
          # default libstdc++, so CMake concludes import std is unsupported and
          # never creates the __CMAKE::CXX26 target that every CXX_MODULE_STD
          # target needs. *_FLAGS_INIT are applied during that detection, so we
          # use them to force libc++ early. (add_compile_options is not.)
          # -nostdinc++ + -isystem <llvm>/include/c++/v1: use LLVM 22's libc++
          #   headers (co-designed with clang 22's module machinery) instead of the
          #   NDK's libc++ 18 headers, which crash clang 22 during BMI emission.
          # -D_LIBCPP_ABI_NAMESPACE=__ndk1 / -D_LIBCPP_ABI_VERSION=1: keep the std::
          #   mangled names and object layouts identical to the NDK libc++_shared.so
          #   we link against (and that the Javet .so was built with).
          # -D_LIBCPP_HAS_NO_TIME_ZONE_DATABASE / -D_LIBCPP_PSTL_CPU_BACKEND_THREAD /
          #   -D_LIBCPP_HARDENING_MODE=2: mirror the NDK __config_site so the header
          #   configuration matches the runtime.
          # -fno-modules-reduced-bmi: force the FULL BMI. Both BMI modes hit the same
          #   clang 22 ASTReader lazy-specialization crash (llvm #165348), but they
          #   crash at different points. Empirically the full BMI is strictly better on
          #   this codebase: with our sealed_map/C-array source fixes it compiles 505 of
          #   525 modules and only trips on a handful of remaining importer files, which
          #   we then fix at the source level. The default reduced BMI crashes much
          #   earlier (environment.h.cc's string_table), so we pin full BMI here.
          set(_libcxx "-nostdinc++ -isystem \$ENV{LIBCXX_SITE} -isystem \$ENV{LIBCXX_INC} -fno-modules-reduced-bmi")
          # -D__BIONIC_CTYPE_INLINE=inline: the C library headers (<ctype.h> etc.)
          # ALWAYS come from the NDK bionic sysroot, regardless of which libc++
          # headers we use. bionic defines isalnum/isalpha/... as `static __inline`
          # (internal linkage) by default; libc++'s std module does
          # `export using std::isalnum;`, and C++ forbids exporting internal-linkage
          # entities, so the std module fails. bionic gates this on
          # __BIONIC_CTYPE_INLINE and supports overriding it; `inline` gives external
          # linkage (C++ inline semantics), making them exportable.
          # NOTE: we deliberately do NOT set -D_LIBCPP_HARDENING_MODE=EXTENSIVE.
          # The upstream (non-Android) build uses the default hardening mode, and
          # EXTENSIVE injects _LIBCPP_ASSERT calls into every container operation,
          # which changes the template bodies of std::optional/expected/array. That
          # difference appears to be what pushes clang 22's ASTReader over the edge
          # when lazily loading those specializations from an imported module's BMI
          # (the module.h.cc / utility.cc / reference.h.cc crashes). Hardening mode
          # only affects inlined assertions in the *header* code we compile; it does
          # not change ABI or the NDK libc++_shared.so we link, so dropping it is safe.
          set(_libcxx_abi "-D_LIBCPP_ABI_VERSION=1 -D_LIBCPP_HAS_NO_TIME_ZONE_DATABASE -D_LIBCPP_PSTL_CPU_BACKEND_THREAD -D__BIONIC_CTYPE_INLINE=inline")
          # -Wno-unused-command-line-argument: with -nostdinc++ we take over the
          # libc++ header search manually, so -stdlib=libc++ is unused for pure
          # module (.cppm) compiles and -Werror would otherwise reject it. We keep
          # -stdlib=libc++ because it is still needed at link time.
          # --rtlib=compiler-rt --unwindlib=libunwind: Debian's apt clang defaults to
          # --rtlib=libgcc, but the Android sysroot has no libgcc (it uses
          # compiler-rt builtins + libunwind, which we staged into the resource
          # dir above). Force compiler-rt so linking finds -l:libclang_rt.builtins
          # / libunwind instead of the missing -lgcc.
          set(_rtlib "--rtlib=compiler-rt --unwindlib=libunwind")
          # nb: The default constexpr evaluator is used (no -fexperimental-new-
          # constant-interpreter). upstream builds struct_template with the default
          # evaluator successfully; the new interpreter was tried to dodge the
          # struct_template consteval crash but it hits the same crash and also
          # mis-escalates P2564. Now that the P2564 root (consteval format_string
          # in accept_with_cast) is fixed via vformat, retest the default evaluator.
          # -fexperimental-new-constant-interpreter: needed to get past the
          # earlier value-acceptor layers; the default evaluator and this one both
          # still crash on the backend struct_template consteval below, but this
          # keeps the known-furthest baseline.
          set(_constexpr "-fexperimental-new-constant-interpreter")
          set(CMAKE_CXX_FLAGS_INIT "-stdlib=libc++ \${_libcxx} \${_libcxx_abi} \${_rtlib} \${_constexpr} -Wno-unused-command-line-argument")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-stdlib=libc++ \${_rtlib} -L\${_sysroot}/usr/lib/${TRIPLET} -lc++_shared")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-stdlib=libc++ \${_rtlib} -L\${_sysroot}/usr/lib/${TRIPLET} -lc++_shared")
          set(CMAKE_MODULE_LINKER_FLAGS_INIT "-stdlib=libc++ \${_rtlib} -L\${_sysroot}/usr/lib/${TRIPLET} -lc++_shared")

          set(CMAKE_FIND_ROOT_PATH "\${_sysroot}")
          # PROGRAM NEVER: use host tools (node, sh) for the npm resolver.
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          # LIBRARY ONLY: never pick up host .so's; link only against the
          # sysroot + our explicitly-staged Javet .so.
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          # INCLUDE/PACKAGE BOTH: the Boost header shim and its BoostConfig live
          # on the host side (outside the sysroot). ONLY would re-root the search
          # into the sysroot and hide -DBoost_DIR=/tmp/fake-boost, breaking
          # find_package(Boost). Header-only Boost carries no ABI, so host
          # headers are safe here.
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
          EOF
          cat /tmp/android-standalone.toolchain.cmake

      # Minimal Boost package shim so find_package(Boost) resolves to the staged
      # header-only tree without pulling host libraries.
      - name: Write Boost shim
        run: |
          set -eux
          mkdir -p /tmp/fake-boost/lib/cmake/Boost
          cat > /tmp/fake-boost/lib/cmake/Boost/BoostConfig.cmake <<'EOF'
          add_library(Boost::boost INTERFACE IMPORTED)
          set_target_properties(Boost::boost PROPERTIES
            INTERFACE_INCLUDE_DIRECTORIES "/tmp/boost-headers")
          set(Boost_FOUND TRUE)
          set(Boost_INCLUDE_DIRS /tmp/boost-headers)
          set(Boost_LIBRARIES "")
          set(Boost_VERSION 1.83.0)
          EOF
          cat > /tmp/fake-boost/lib/cmake/Boost/BoostConfigVersion.cmake <<'EOF'
          set(PACKAGE_VERSION 1.83.0)
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          EOF

      - name: Configure
        env:
          NODE_DIST_DIR: deps/nodejs/${{ env.NODE_HEADERS }}
        run: |
          set -eux
          NODE_INC="${PWD}/deps/nodejs/${NODE_HEADERS}/include/node"
          cmake \
            -S "${PWD}" \
            -B "${PWD}/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/android-standalone.toolchain.cmake \
            -DCMAKE_MODULE_PATH="$(pnpm exec auto_js_cmake_include)" \
            -DCMAKE_PREFIX_PATH=/tmp/fake-boost \
            -DBoost_DIR=/tmp/fake-boost/lib/cmake/Boost \
            -DNODE_DIST_DIR="${PWD}/deps/nodejs/${NODE_HEADERS}" \
            -DV8_LIBRARY_TYPE=shared \
            -DV8_LIBRARY_PATH="${PWD}/deps/javet" \
            -DV8_INCLUDE_DIR="${NODE_INC}" \
            -DV8_INCLUDE_GN_FILE="${NODE_INC}/v8-gn.h" \
            -DV8_SHARED_LIBS=javet \
            -DV8_TRICKSHOT= \
            -DCMAKE_CXX_STDLIB_MODULES_JSON="${STDLIB_MODULES_JSON}" \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            -DIVM_DISABLE_IPO=ON \
            -DIVM_INSTALL=artifacts

      - name: Build
        # clang 23 turned the module.h.cc / reference.h.cc ASTReader crash into a
        # protected stack-exhaustion abort (StackExhaustionHandler): serializing
        # these largest-import-closure partitions' BMI recurses deeply through the
        # redeclaration chain (CompleteRedeclChain / adjustDeducedFunctionResultType)
        # and runs out of the default 8 MiB thread stack. Raise the stack limit so
        # the (finite, valid) recursion can complete. ninja inherits this ulimit and
        # passes it on to the clang child processes.
        run: |
          set -eux
          ulimit -s unlimited || ulimit -s 131072 || true
          ninja -C build backend_napi_v8

      - name: Inspect artifact
        if: success()
        run: |
          set -eux
          find build -name '*.node' -exec ls -lh {} \;
          NODE_FILE=$(find build -name '*.node' | head -n1)
          "$LLVM_DIR/bin/llvm-readelf" -d "$NODE_FILE" | grep -E 'NEEDED|SONAME' || true

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/packages/backend_napi_v8/artifacts
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Minimal, self-contained repro of the clang module/BMI crash, isolated from
  # the full isolated-vm project. Compiles two tiny C++26 module files under
  # several toolchain configs to pinpoint WHICH variable triggers the
  # `realloc(): invalid pointer` / ASTReader crash:
  #   A) clang-23 + linux-gnu target + native libc++   (== upstream-like)
  #   B) clang-23 + android  target + NDK libc++18
  #   C) clang-23 + android  target + LLVM libc++ hdrs + __ndk1  (== our build)
  # The first config that crashes identifies the responsible variable. Each is
  # run with `|| true` so all configs report even if earlier ones crash.
  repro:
    name: Repro (clang crash isolation)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-23 + NDK
        run: |
          set -eux
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23 all
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Run repro matrix
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -ux
          CXX=/usr/lib/llvm-23/bin/clang++
          SR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          D=.github/repro
          "$CXX" --version

          echo "===== A) clang-23 + linux-gnu + native libc++ ====="
          ( set -x
            "$CXX" --target=x86_64-unknown-linux-gnu -stdlib=libc++ -std=gnu++26 \
              -fno-modules-reduced-bmi --precompile "$D/m.cppm" -o /tmp/mA.pcm &&
            "$CXX" --target=x86_64-unknown-linux-gnu -stdlib=libc++ -std=gnu++26 \
              -fno-modules-reduced-bmi -fmodule-file=m=/tmp/mA.pcm -c "$D/consumer.cppm" -o /tmp/cA.o
            echo "A exit: $?" ) || echo "A CRASHED/FAILED"

          echo "===== B) clang-23 + android + NDK libc++18 ====="
          ( set -x
            "$CXX" --target=x86_64-linux-android24 --sysroot="$SR" -stdlib=libc++ -std=gnu++26 \
              -fno-modules-reduced-bmi --precompile "$D/m.cppm" -o /tmp/mB.pcm &&
            "$CXX" --target=x86_64-linux-android24 --sysroot="$SR" -stdlib=libc++ -std=gnu++26 \
              -fno-modules-reduced-bmi -fmodule-file=m=/tmp/mB.pcm -c "$D/consumer.cppm" -o /tmp/cB.o
            echo "B exit: $?" ) || echo "B CRASHED/FAILED"

          echo "===== C) clang-23 + android + LLVM libc++ hdrs + __ndk1 ====="
          LX=$(find /usr/lib/llvm-23/include -maxdepth 4 -name version -path '*c++*' | head -n1)
          LXDIR=$(dirname "$LX")
          ( set -x
            "$CXX" --target=x86_64-linux-android24 --sysroot="$SR" -stdlib=libc++ \
              -nostdinc++ -isystem "$LXDIR" -std=gnu++26 -fno-modules-reduced-bmi \
              -D_LIBCPP_ABI_NAMESPACE=__ndk1 -D_LIBCPP_ABI_VERSION=1 -D__BIONIC_CTYPE_INLINE=inline \
              --precompile "$D/m.cppm" -o /tmp/mC.pcm &&
            "$CXX" --target=x86_64-linux-android24 --sysroot="$SR" -stdlib=libc++ \
              -nostdinc++ -isystem "$LXDIR" -std=gnu++26 -fno-modules-reduced-bmi \
              -D_LIBCPP_ABI_NAMESPACE=__ndk1 -D_LIBCPP_ABI_VERSION=1 -D__BIONIC_CTYPE_INLINE=inline \
              -fmodule-file=m=/tmp/mC.pcm -c "$D/consumer.cppm" -o /tmp/cC.o
            echo "C exit: $?" ) || echo "C CRASHED/FAILED"

          echo "===== repro matrix done ====="
