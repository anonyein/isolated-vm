name: Build Android (Javet-linked, final)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.15.0
  ANDROID_NDK_VERSION: r29
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/7d0062b9e4e4fe1bd0084ce96354239c"
          - abi: x86_64
            triplet: x86_64-linux-android
            ndk_api: 24
            download_url: "https://links.8uid.com/d/c36d90e473694d96e422a823bd1148c7"

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl tar zstd libboost-all-dev

      - name: 准备独立的 Boost 头文件目录
        run: |
          mkdir -p /tmp/host-boost-headers
          cp -r /usr/include/boost /tmp/host-boost-headers/boost

      - name: 安装 CMake 4.0.0
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.0.0/cmake-4.0.0-linux-x86_64.sh -o cmake.sh
          sudo bash cmake.sh --prefix=/usr/local --skip-license
          cmake --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: 安装 npm 依赖并编译 TypeScript
        run: |
          pnpm install --frozen-lockfile
          npx tsc -b

      - name: 下载并配置 Android NDK (r29)
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: 安装 Playwright
        run: pnpm add -D -w playwright

      - name: 安装 Playwright 浏览器
        run: npx playwright install chromium

      - name: 下载 Javet SO (headless)
        continue-on-error: true
        run: |
          cat > download.cjs << 'SCRIPT_END'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const url = process.env.DOWNLOAD_URL;
            try {
              const [download] = await Promise.all([
                page.waitForEvent('download', { timeout: 60000 }),
                page.goto(url, { waitUntil: 'networkidle' })
              ]);
              await download.saveAs('deps/javet/' + process.env.JAVET_SO_NAME);
              console.log('下载成功');
            } catch (e) {
              console.error('下载失败，继续构建:', e.message);
            } finally {
              await browser.close();
            }
          })()
          SCRIPT_END
          mkdir -p deps/javet
          node download.cjs
        env:
          DOWNLOAD_URL: ${{ matrix.download_url }}
          JAVET_SO_NAME: ${{ env.JAVET_SO_NAME }}

      - name: 下载 Node.js 头文件
        run: |
          if [ -f scripts/nodejs_select ]; then
            bash scripts/nodejs_select "deps/nodejs/${{ env.NODE_HEADERS }}"
          else
            mkdir -p deps/nodejs
            curl -fsSL https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz | tar -xz -C deps/nodejs --strip-components=1
          fi

      - name: 将 Node 头文件复制到各子包预期位置
        run: |
          mkdir -p packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/
          mkdir -p packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/

      - name: 准备 V8 头文件（补全缺失的 v8-gn.h）
        run: |
          touch deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h

      - name: 移除不兼容的 CMake 属性和平台限制
        run: |
          find . -name "CMakeLists.txt" -exec sed -i '/LINKER_TYPE/d' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/CXX_MODULE_STD/d' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/Unknown host platform/s/^/#/' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/Unsupported API/s/^/#/' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/message(FATAL_ERROR "Unknown host platform")/s/^/#/' {} \;

      - name: 配置 CMake
        shell: bash
        run: |
          mkdir -p fake-boost/lib/cmake/Boost
          cat > fake-boost/lib/cmake/Boost/BoostConfig.cmake << 'BOOST_EOF'
          add_library(Boost::boost INTERFACE IMPORTED)
          set_target_properties(Boost::boost PROPERTIES
            INTERFACE_INCLUDE_DIRECTORIES "/usr/include"
          )
          set(Boost_FOUND TRUE)
          set(Boost_INCLUDE_DIRS /usr/include)
          set(Boost_LIBRARIES "")
          set(Boost_VERSION 1.83.0)
          BOOST_EOF
          cat > fake-boost/lib/cmake/Boost/BoostConfigVersion.cmake << 'BOOST_VER_EOF'
          set(PACKAGE_VERSION 1.83.0)
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          BOOST_VER_EOF

          mkdir -p "${PWD}/build/module_cache"

          cat > ./custom.android.toolchain.cmake << 'NDK_EOF'
          include($ENV{ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake)
          set(CMAKE_LINKER_TYPE DEFAULT CACHE STRING "" FORCE)
          set(ANDROID_STL c++_shared)
          set(CMAKE_LINKER "$ENV{ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld" CACHE FILEPATH "" FORCE)
          set(CMAKE_CXX_SCAN_FOR_MODULES ON CACHE BOOL "Enable C++20 module scanning" FORCE)
          # 追加 Boost 路径、隐式模块映射和缓存路径（切勿覆盖 CMAKE_CXX_FLAGS 中原有内容）
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -isystem /tmp/host-boost-headers -fimplicit-module-maps -fmodules-cache-path=${CMAKE_BINARY_DIR}/module_cache" CACHE STRING "" FORCE)
          NDK_EOF

          AUTO_JS_PATH=$(npm exec auto_js_cmake_include)
          V8_INCLUDE_DIR="${PWD}/deps/nodejs/${NODE_HEADERS}/include/node"

          cmake \
            -S "${PWD}" \
            -B "${PWD}/build" \
            -DCMAKE_MODULE_PATH="${AUTO_JS_PATH}" \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/custom.android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.ndk_api }}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_PREFIX_PATH="${PWD}/fake-boost" \
            -DBoost_DIR="${PWD}/fake-boost/lib/cmake/Boost" \
            -DV8_LIBRARY_TYPE=shared \
            -DV8_INCLUDE_DIR="${V8_INCLUDE_DIR}" \
            -DV8_INCLUDE_GN_FILE="${V8_INCLUDE_DIR}/v8-gn.h" \
            -DV8_LIBRARY_PATH="${PWD}/deps/javet" \
            -DNODE_DIST_DIR="deps/nodejs/${{ env.NODE_HEADERS }}" \
            -DIVM_INSTALL=copy \
            -G Ninja

      - name: 修复源码与编译参数（模块替换为头文件）
        shell: bash
        run: |
          echo "=== 将 C++20 模块导入替换为传统 #include ==="
          # 1. 定义模块到头文件的映射（项目内部，按目录结构猜测）
          declare -A MODULE_MAP
          MODULE_MAP["util:container.mutable_priority_queue"]="utility/container/mutable_priority_queue.h"
          MODULE_MAP["util:container.segmented_priority_queue"]="utility/container/segmented_priority_queue.h"
          MODULE_MAP["util:container.sealed_map"]="utility/container/sealed_map.h"
          MODULE_MAP["util:container.tinker_queue"]="utility/container/tinker_queue.h"
          MODULE_MAP["util:functional.bind"]="utility/functional/bind.h"
          MODULE_MAP["util:functional.regular_return"]="utility/functional/regular_return.h"
          MODULE_MAP["util:functional.elide"]="utility/functional/elide.h"
          MODULE_MAP["util:functional.function_constant"]="utility/functional/function_constant.h"
          MODULE_MAP["util:functional.function_ref"]="utility/functional/function_ref.h"
          MODULE_MAP["util:functional.flat_tuple"]="utility/functional/flat_tuple.h"
          MODULE_MAP["util:functional.functional"]="utility/functional/functional.h"
          MODULE_MAP["util:memory.autorelease_pool"]="utility/memory/autorelease_pool.h"
          MODULE_MAP["util:memory.comparator"]="utility/memory/comparator.h"
          MODULE_MAP["util:memory.noinit_allocator"]="utility/memory/noinit_allocator.h"
          MODULE_MAP["util:memory.memory"]="utility/memory/memory.h"
          MODULE_MAP["util:meta.algorithm"]="utility/meta/algorithm.h"
          MODULE_MAP["util:platform.stop_token"]="utility/platform/stop_token.h"
          MODULE_MAP["util:platform.lockable"]="utility/platform/lockable.h"
          MODULE_MAP["util:platform.timer"]="utility/platform/timer.h"
          MODULE_MAP["util:type_traits.transform"]="utility/type_traits/transform.h"
          MODULE_MAP["util:type_traits.type_of"]="utility/type_traits/type_of.h"
          MODULE_MAP["util:type_traits.function_traits"]="utility/type_traits/function_traits.h"
          MODULE_MAP["util:type_traits.type_traits"]="utility/type_traits/type_traits.h"
          MODULE_MAP["util:type_traits.type_pack"]="utility/type_traits/type_pack.h"
          MODULE_MAP["util:utility.constant_wrapper"]="utility/utility/constant_wrapper.h"
          MODULE_MAP["util:utility.covariant_value"]="utility/utility/covariant_value.h"
          MODULE_MAP["util:utility.facade"]="utility/utility/facade.h"
          MODULE_MAP["util:utility.hash"]="utility/utility/hash.h"
          MODULE_MAP["util:utility.string"]="utility/utility/string.h"
          MODULE_MAP["util:utility.utility"]="utility/utility/utility.h"
          MODULE_MAP["util:utility.variant"]="utility/utility/variant.h"
          MODULE_MAP["util:utility.ranges"]="utility/utility/ranges.h"
          MODULE_MAP["auto_js:builtin.accept"]="auto_js/js/builtin/accept.h"
          MODULE_MAP["auto_js:builtin.visit"]="auto_js/js/builtin/visit.h"
          MODULE_MAP["auto_js:builtin.value"]="auto_js/js/builtin/value.h"
          MODULE_MAP["auto_js:enum.types"]="auto_js/js/enum/types.h"
          MODULE_MAP["auto_js:enum.accept"]="auto_js/js/enum/accept.h"
          MODULE_MAP["auto_js:enum.visit"]="auto_js/js/enum/visit.h"
          MODULE_MAP["auto_js:intrinsics.array_buffer"]="auto_js/js/intrinsics/array_buffer.h"
          MODULE_MAP["auto_js:intrinsics.bigint"]="auto_js/js/intrinsics/bigint.h"
          MODULE_MAP["auto_js:intrinsics.date"]="auto_js/js/intrinsics/date.h"
          MODULE_MAP["auto_js:intrinsics.error"]="auto_js/js/intrinsics/error.h"
          MODULE_MAP["auto_js:intrinsics.external"]="auto_js/js/intrinsics/external.h"
          MODULE_MAP["auto_js:reference.accept"]="auto_js/js/reference/accept.h"
          MODULE_MAP["auto_js:reference.visit"]="auto_js/js/reference/visit.h"
          MODULE_MAP["auto_js:reference.reference_of"]="auto_js/js/reference/reference_of.h"
          MODULE_MAP["auto_js:reference.referential_value"]="auto_js/js/reference/referential_value.h"
          MODULE_MAP["auto_js:struct.accept"]="auto_js/js/struct/accept.h"
          MODULE_MAP["auto_js:struct.visit"]="auto_js/js/struct/visit.h"
          MODULE_MAP["auto_js:struct.types"]="auto_js/js/struct/types.h"
          MODULE_MAP["auto_js:tag"]="auto_js/js/tag.h"
          MODULE_MAP["auto_js:transfer.accept"]="auto_js/js/transfer/accept.h"
          MODULE_MAP["auto_js:transfer.visit"]="auto_js/js/transfer/visit.h"
          MODULE_MAP["auto_js:transfer.types"]="auto_js/js/transfer/types.h"
          MODULE_MAP["auto_js:transfer.deferred_receiver"]="auto_js/js/transfer/deferred_receiver.h"
          MODULE_MAP["auto_js:tuple.accept"]="auto_js/js/tuple/accept.h"
          MODULE_MAP["auto_js:tuple.visit"]="auto_js/js/tuple/visit.h"
          MODULE_MAP["auto_js:type.property"]="auto_js/js/type/property.h"
          MODULE_MAP["auto_js:type.function"]="auto_js/js/type/function.h"
          MODULE_MAP["auto_js:union.accept"]="auto_js/js/union/accept.h"
          MODULE_MAP["auto_js:union.types"]="auto_js/js/union/types.h"
          MODULE_MAP["auto_js:variant.accept"]="auto_js/js/variant/accept.h"
          MODULE_MAP["auto_js:variant.visit"]="auto_js/js/variant/visit.h"
          MODULE_MAP["auto_js:variant.types"]="auto_js/js/variant/types.h"
          MODULE_MAP["auto_js:vector.accept"]="auto_js/js/vector/accept.h"
          MODULE_MAP["auto_js:vector.visit"]="auto_js/js/vector/visit.h"
          MODULE_MAP["auto_js:vector.vector_of"]="auto_js/js/vector/vector_of.h"
          MODULE_MAP["auto_js:napi._module"]="auto_js/napi/_module.h"
          MODULE_MAP["auto_js:napi.api"]="auto_js/napi/api.h"
          MODULE_MAP["auto_js:napi.callback_info"]="auto_js/napi/api/callback_info.h"
          # ... 其他需要时再添加

          # 2. 遍历所有 .cc 文件，替换模块导入
          for f in $(find packages -name '*.cc'); do
            for mod in "${!MODULE_MAP[@]}"; do
              header="${MODULE_MAP[$mod]}"
              # 替换 import module_name; 为 #include "header"
              sed -i "s|import ${mod};|#include \"${header}\"|g" "$f"
              # 替换 import :partition; 为对应的 import（如果没有完全限定）
              # 此处仅处理常见情况，可能需要更复杂的解析，但由于源文件大多用了完全限定名，我们先从这里开始
            done
            # 删除剩余的 import std; （如果还有）
            sed -i '/^import std;$/d' "$f"
            # 注释掉 export module xxx; 声明（不再需要模块导出）
            sed -i 's/^export module .*/\/\/ export module ... (disabled for header-only)/' "$f"
            # 同时注释掉 module; 声明
            sed -i 's/^module;$/\/\/ module; (disabled)/' "$f"
          done

          # 3. 如果某些 .h 文件不存在，我们需要生成简单的头文件（包含原本的定义）
          # 这里不再详细展开，因为这过于复杂且不确定。如果报头文件缺失，构建还是会失败，因此强烈建议检查并补全。

          # 4. 修复 elide.cc 的语法
          sed -i -E '/auto[[:space:]]*\[\.\.\.[[:space:]]*args[[:space:]]*\][[:space:]]*=[[:space:]]*std::move\(args_\);/d' packages/utility/functional/elide.cc
          sed -i 's/std::move(args)\.\.\./std::forward<Args>(args_).../g' packages/utility/functional/elide.cc

          # 5. 清除之前可能插入的 bits/stdc++.h（因为现在我们不再需要）
          find packages -name '*.cc' -exec sed -i '/^#include <bits\/stdc++.h>$/d' {} \;

          # 6. 清理不兼容标志
          find build -name '*.ninja' -exec sed -i 's/-fno-modules-reduced-bmi//g' {} \;
          find build -name '*.ninja' -exec sed -i 's/-Wno-include-angled-in-module-purview//g' {} \;
          find build -name '*.ninja' -exec sed -i 's/-Wno-reserved-module-identifier//g' {} \;
          # 移除模块相关标志，因为不再需要
          find build -name '*.ninja' -exec sed -i 's/-fimplicit-module-maps//g' {} \;
          find build -name '*.ninja' -exec sed -i 's/-fimplicit-modules//g' {} \;
          find build -name '*.ninja' -exec sed -i 's|-fmodules-cache-path=[^ ]*||g' {} \;

          # 7. 注入 Boost 路径
          CLANGXX='/tmp/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++'
          EXTRA_FLAGS="-isystem /tmp/host-boost-headers"
          find build -name '*.ninja' -exec sed -i "s|${CLANGXX} |${CLANGXX} ${EXTRA_FLAGS} |g" {} \;

          echo "模块到头文件转换完成（可能仍需根据缺失头文件进行调整）"

      - name: 构建
        run: ninja -C build backend_napi_v8

      - name: 验证产物
        run: |
          ls -lh build/packages/backend_napi_v8/
          file build/packages/backend_napi_v8/backend_napi_v8.node

      - uses: actions/upload-artifact@v6
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/packages/backend_napi_v8/artifacts
          if-no-files-found: error
