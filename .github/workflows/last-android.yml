name: Build Android (Javet-linked, final)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.15.0
  ANDROID_NDK_VERSION: r30-beta1
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
          - abi: x86_64
            triplet: x86_64-linux-android
            ndk_api: 24

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl tar zstd libboost-all-dev p7zip-full

      - name: 准备独立的 Boost 头文件目录
        run: |
          mkdir -p /tmp/host-boost-headers
          cp -r /usr/include/boost /tmp/host-boost-headers/boost

      - name: 安装 CMake 4.0.0
        run: |
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v4.0.0/cmake-4.0.0-linux-x86_64.sh -o cmake.sh
          sudo bash cmake.sh --prefix=/usr/local --skip-license
          cmake --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: 安装 npm 依赖并编译 TypeScript
        run: |
          pnpm install --frozen-lockfile
          npx tsc -b

      - name: 下载并配置 Android NDK (r30-beta1)
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: 解压 Javet SO 分卷
        run: |
          cat libs.7z.001 libs.7z.002 libs.7z.003 > libs.7z
          7z x libs.7z -olibs
          find libs -type f

      - name: 复制对应架构的 SO 到 deps/javet
        run: |
          mkdir -p deps/javet
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ARCH_DIR="arm64-v8a"
          else
            ARCH_DIR="x86_64"
          fi
          cp "libs/${ARCH_DIR}/${JAVET_SO_NAME}" "deps/javet/${JAVET_SO_NAME}"
          echo "已复制 libs/${ARCH_DIR}/${JAVET_SO_NAME} -> deps/javet/${JAVET_SO_NAME}"

      - name: 下载 Node.js 头文件
        run: |
          if [ -f scripts/nodejs_select ]; then
            bash scripts/nodejs_select "deps/nodejs/${{ env.NODE_HEADERS }}"
          else
            mkdir -p deps/nodejs
            curl -fsSL https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz | tar -xz -C deps/nodejs --strip-components=1
          fi

      - name: 将 Node 头文件复制到各子包预期位置
        run: |
          mkdir -p packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/
          mkdir -p packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/

      - name: 准备 V8 头文件（补全缺失的 v8-gn.h）
        run: |
          touch deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h

      - name: 移除不兼容的 CMake 属性和平台限制
        run: |
          find . -name "CMakeLists.txt" -exec sed -i '/LINKER_TYPE/d' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/CXX_MODULE_STD/d' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/Unknown host platform/s/^/#/' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/Unsupported API/s/^/#/' {} \;
          find . -name "CMakeLists.txt" -exec sed -i '/message(FATAL_ERROR "Unknown host platform")/s/^/#/' {} \;

      # CMake 仍然配置一次，但不用于构建
      - name: 配置 CMake
        shell: bash
        run: |
          mkdir -p fake-boost/lib/cmake/Boost
          cat > fake-boost/lib/cmake/Boost/BoostConfig.cmake << 'BOOST_EOF'
          add_library(Boost::boost INTERFACE IMPORTED)
          set_target_properties(Boost::boost PROPERTIES
            INTERFACE_INCLUDE_DIRECTORIES "/usr/include"
          )
          set(Boost_FOUND TRUE)
          set(Boost_INCLUDE_DIRS /usr/include)
          set(Boost_LIBRARIES "")
          set(Boost_VERSION 1.83.0)
          BOOST_EOF
          cat > fake-boost/lib/cmake/Boost/BoostConfigVersion.cmake << 'BOOST_VER_EOF'
          set(PACKAGE_VERSION 1.83.0)
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          BOOST_VER_EOF

          mkdir -p "${PWD}/build/module_cache"

          cat > ./custom.android.toolchain.cmake << 'NDK_EOF'
          include($ENV{ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake)
          set(CMAKE_LINKER_TYPE DEFAULT CACHE STRING "" FORCE)
          set(ANDROID_STL c++_shared)
          set(CMAKE_LINKER "$ENV{ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld" CACHE FILEPATH "" FORCE)
          set(CMAKE_CXX_SCAN_FOR_MODULES OFF CACHE BOOL "Disable C++20 scans" FORCE)
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -isystem /tmp/host-boost-headers" CACHE STRING "" FORCE)
          NDK_EOF

          AUTO_JS_PATH=$(npm exec auto_js_cmake_include)
          V8_INCLUDE_DIR="${PWD}/deps/nodejs/${NODE_HEADERS}/include/node"

          cmake \
            -S "${PWD}" \
            -B "${PWD}/build" \
            -DCMAKE_MODULE_PATH="${AUTO_JS_PATH}" \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/custom.android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.ndk_api }}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=ninja \
            -DCMAKE_PREFIX_PATH="${PWD}/fake-boost" \
            -DBoost_DIR="${PWD}/fake-boost/lib/cmake/Boost" \
            -DV8_LIBRARY_TYPE=shared \
            -DV8_INCLUDE_DIR="${V8_INCLUDE_DIR}" \
            -DV8_INCLUDE_GN_FILE="${V8_INCLUDE_DIR}/v8-gn.h" \
            -DV8_LIBRARY_PATH="${PWD}/deps/javet" \
            -DNODE_DIST_DIR="deps/nodejs/${{ env.NODE_HEADERS }}" \
            -DIVM_INSTALL=copy \
            -G Ninja

      - name: 修复源码（补全所有缺失的分区导入、修正 GCC 扩展，替换 timer.cc 占位）
        shell: bash
        run: |
          echo "修复源码..."
          find packages -name '*.cc' -exec sed -i '/^import std;$/d' {} \;
          NDK_CXX_HEADERS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1"
          mkdir -p "${NDK_CXX_HEADERS}/bits"
          cat > "${NDK_CXX_HEADERS}/bits/stdc++.h" << 'STD_HEADER'
          #include <cstdlib>
          #include <cstdint>
          #include <cstddef>
          #include <cstring>
          #include <cwchar>
          #include <cstdio>
          #include <cassert>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <concepts>
          #include <condition_variable>
          #include <deque>
          #include <exception>
          #include <forward_list>
          #include <functional>
          #include <initializer_list>
          #include <iomanip>
          #include <iostream>
          #include <iterator>
          #include <limits>
          #include <list>
          #include <map>
          #include <memory>
          #include <mutex>
          #include <new>
          #include <numeric>
          #include <optional>
          #include <queue>
          #include <random>
          #include <ratio>
          #include <set>
          #include <shared_mutex>
          #include <span>
          #include <sstream>
          #include <stack>
          #include <stdexcept>
          #include <stop_token>
          #include <string>
          #include <string_view>
          #include <source_location>
          #include <tuple>
          #include <type_traits>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <variant>
          #include <vector>
          #include <cmath>
          #include <compare>
          #include <ranges>
          #include <bit>
          #include <version>
          STD_HEADER
          sed -i -E '/auto[[:space:]]*\[\.\.\.[[:space:]]*args[[:space:]]*\][[:space:]]*=[[:space:]]*std::move\(args_\);/d' packages/utility/functional/elide.cc
          sed -i 's/std::move(args)\.\.\./std::forward<Args>(args_).../g' packages/utility/functional/elide.cc
          sed -i -E '/const auto \[\.\.\. indices \]/s/\[\.\.\. indices \]/[...indices]/' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:meta\.algorithm;$/a\import :type_traits.type_pack;' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:meta\.algorithm;$/a\import :utility;' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:utility\.variant;$/a\import :type_traits.transform;' packages/utility/utility/variant.cc

          for f in $(grep -rl 'module util' packages/); do
            sed -i '/^#include <bits\/stdc++.h>$/d' "$f"
            sed -i '/^module;$/d' "$f"
            sed -i '1i\module;' "$f"
            sed -i '2i\#include <bits/stdc++.h>' "$f"
          done

          for file in packages/utility/functional/regular_return.cc packages/utility/functional/bind.cc; do
            sed -i '/^import :type_traits\.transform;$/d' "$file"
            sed -i '/^export module util:functional\.\(regular_return\|bind\);$/a\import :type_traits.transform;' "$file"
          done
          sed -i '/^export module util:functional\.bind;$/a\import :type_traits.function_traits;' packages/utility/functional/bind.cc
          sed -i '/^export module util:functional\.bind;$/a\import :type_traits;' packages/utility/functional/bind.cc
          sed -i '/^export module util:platform\.lockable;$/a\import :type_traits.type_of;' packages/utility/platform/lockable.cc
          sed -i '/^export module util:platform\.stop_token;$/a\import :functional;' packages/utility/platform/stop_token.cc
          sed -i '/^export module util:platform\.stop_token;$/a\import :utility;' packages/utility/platform/stop_token.cc
          sed -i '/^export module util:platform\.timer;$/a\import :functional;' packages/utility/platform/timer.cc
          sed -i '/^export module util:platform\.timer;$/a\import :platform.lockable;' packages/utility/platform/timer.cc

          # 核心修复：将 timer.cc 替换为空实现
          cat > packages/utility/platform/timer.cc << 'TIMER_EOF'
          module;
          #include <bits/stdc++.h>
          export module util:platform.timer;
          import :functional;
          import :platform.lockable;

          namespace util {
              struct timer_thread {
                  timer_thread() {}
                  void request_stop() {}
                  void join() {}
              };
          }
          TIMER_EOF

      - name: 手动编译并链接（绕过 Ninja）
        working-directory: ${{ github.workspace }}
        shell: python3 {0}
        run: |
          import os, subprocess, re, glob, collections

          SRC_ROOT = os.getcwd()
          NDK_HOME = "/tmp/android-ndk"
          CLANGXX = NDK_HOME + "/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          TARGET = "${{ matrix.triplet }}${{ matrix.ndk_api }}"
          SYSROOT = NDK_HOME + "/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NODE_VER = os.environ["NODE_HEADERS"]
          NODE_DIR = f"/tmp/node-v{NODE_VER}"  # 解压后路径实际为 deps/nodejs/...
          JAVET_SO = f"deps/javet/{os.environ['JAVET_SO_NAME']}"

          BASE_FLAGS = f"--target={TARGET} --sysroot={SYSROOT} -std=gnu++26 -fPIC -fvisibility=hidden " \
                       f"-isystem /tmp/host-boost-headers " \
                       f"-isystem {SRC_ROOT}/packages/utility/include " \
                       f"-isystem {SRC_ROOT}/packages/auto_js/napi/include " \
                       f"-isystem {SRC_ROOT}/packages/backend_napi_v8/runtime " \
                       f"-isystem {SRC_ROOT}/packages/third_party/nodejs/deps/nodejs/{NODE_VER}/src " \
                       f"-isystem {SRC_ROOT}/packages/third_party/nodejs/deps/nodejs/{NODE_VER}/deps/v8/include " \
                       f"-isystem {SRC_ROOT}/packages/third_party/nodejs/deps/nodejs/{NODE_VER}/deps/uv/include " \
                       f"-isystem {SRC_ROOT}/packages/third_party/nodejs/deps/nodejs/{NODE_VER}/include/node " \
                       f"-isystem {SRC_ROOT}/packages/third_party/v8 " \
                       f"-DEXPORT_IS_EXPORT -DNAPI_VERSION=10 -DINCLUDE_ISOLATED_V8 " \
                       f"-DV8_Dcheck=Z8_Dcheck -DV8_Fatal=Z8_Fatal -Dcppgc=zppgc -Dunibrow=znibrow -Dv8=z8 -Dv8_crdtp=z8_crdtp -Dv8_inspector=z8_inspector " \
                       f"-O3 -DNDEBUG"

          OBJ_DIR = os.path.join(SRC_ROOT, "build", "objs")
          os.makedirs(OBJ_DIR, exist_ok=True)

          # 收集源文件（排除 node_modules, test, tests, deps, benchmark）
          cc_files = []
          for root, dirs, files in os.walk(os.path.join(SRC_ROOT, "packages")):
              dirs[:] = [d for d in dirs if d not in ("node_modules", "test", "tests", "deps", "benchmark")]
              for f in files:
                  if f.endswith(".cc"):
                      cc_files.append(os.path.join(root, f))

          # 提取模块信息
          module_sources = collections.defaultdict(list)
          edges = []
          all_modules = set()

          for fpath in cc_files:
              with open(fpath, "r", errors="ignore") as fh:
                  content = fh.read()
              mods = re.findall(r'export module (\S+?);', content)
              if mods:
                  mod = mods[0]
                  all_modules.add(mod)
                  module_sources[mod].append(fpath)
                  imports = re.findall(r'import ([:\w\.]+?);', content)
                  for imp in imports:
                      if imp.startswith(":"):
                          full = mod + imp
                      else:
                          full = imp
                      edges.append((fpath, mod, full))

          # 构建依赖图
          graph = collections.defaultdict(list)
          indegree = collections.defaultdict(int)
          for m in all_modules:
              indegree[m] = indegree.get(m, 0)
          for _, mod, dep in edges:
              if dep in all_modules and dep != mod:
                  graph[dep].append(mod)
                  indegree[mod] += 1

          # 拓扑排序
          queue = [m for m in all_modules if indegree[m] == 0]
          sorted_modules = []
          while queue:
              m = queue.pop(0)
              sorted_modules.append(m)
              for nxt in graph[m]:
                  indegree[nxt] -= 1
                  if indegree[nxt] == 0:
                      queue.append(nxt)
          for m in all_modules:
              if m not in sorted_modules:
                  sorted_modules.append(m)

          # 编译函数
          compiled_pcm = {}
          def compile_module(mod_name):
              if mod_name in compiled_pcm:
                  return
              src = module_sources[mod_name][0]
              pcm_path = os.path.join(OBJ_DIR, f"{mod_name.replace(':', '-')}.pcm")
              obj_path = os.path.join(OBJ_DIR, f"{os.path.relpath(src, SRC_ROOT).replace('/', '_')}.o")

              extra = []
              for dep in re.findall(r'import ([:\w\.]+?);', open(src).read()):
                  if dep.startswith(":"):
                      dep_full = mod_name + dep
                  else:
                      dep_full = dep
                  if dep_full in compiled_pcm:
                      extra.append(f"-fmodule-file={dep_full}={compiled_pcm[dep_full]}")
              # 分区需要主模块
              if ':' in mod_name:
                  main_mod = mod_name.split(':')[0]
                  if main_mod in compiled_pcm:
                      extra.append(f"-fmodule-file={main_mod}={compiled_pcm[main_mod]}")

              cmd_pcm = [CLANGXX] + BASE_FLAGS.split() + ["-c", "-Xclang", "-emit-module-interface", src, "-o", pcm_path] + extra
              print(f"PCM: {mod_name}")
              subprocess.run(cmd_pcm, check=True)
              compiled_pcm[mod_name] = pcm_path

              cmd_obj = [CLANGXX] + BASE_FLAGS.split() + ["-c", src, "-o", obj_path] + extra
              subprocess.run(cmd_obj, check=True)

          # 按顺序编译所有模块
          for mod in sorted_modules:
              compile_module(mod)

          # 编译普通源文件（无 export module）
          handled_files = set()
          for flist in module_sources.values():
              handled_files.update(flist)
          for fpath in cc_files:
              if fpath not in handled_files:
                  obj_path = os.path.join(OBJ_DIR, f"{os.path.relpath(fpath, SRC_ROOT).replace('/', '_')}.o")
                  print(f"OBJ: {os.path.relpath(fpath, SRC_ROOT)}")
                  subprocess.run([CLANGXX] + BASE_FLAGS.split() + ["-c", fpath, "-o", obj_path], check=True)

          # 链接
          objs = glob.glob(os.path.join(OBJ_DIR, "*.o"))
          out_node = os.path.join(SRC_ROOT, "build", "backend_napi_v8.node")
          link_cmd = [CLANGXX, f"--target={TARGET}", f"--sysroot={SYSROOT}", "-shared"] + objs + [
              JAVET_SO, "-luv", "-landroid", "-llog", "-lEGL", "-lGLESv2", "-lOpenSLES",
              "-o", out_node
          ]
          print("正在链接...")
          subprocess.run(link_cmd, check=True)
          print(f"产物已生成：{out_node}")

      - name: 验证产物
        if: success()
        run: |
          ls -lh build/backend_napi_v8.node
          file build/backend_napi_v8.node

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/backend_napi_v8.node
          if-no-files-found: error
