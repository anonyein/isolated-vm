name: Build Android (Hybrid: Hardcoded util + Auto scan rest)

on:
  workflow_dispatch:
  push:
    branches: [ experimental ]

env:
  JAVET_SO_NAME: libjavet-node-android-i18n.v.5.0.7.so
  NODE_HEADERS: 24.15.0
  ANDROID_NDK_VERSION: r30-beta1
  ANDROID_NDK_HOME: /tmp/android-ndk

jobs:
  build-android:
    name: Build Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            triplet: aarch64-linux-android
            ndk_api: 24
          - abi: x86_64
            triplet: x86_64-linux-android
            ndk_api: 24

    env:
      TRIPLET: ${{ matrix.triplet }}
      ABI: ${{ matrix.abi }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v5

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build curl tar zstd libboost-all-dev p7zip-full

      - name: 准备独立的 Boost 头文件目录
        run: |
          mkdir -p /tmp/host-boost-headers
          cp -r /usr/include/boost /tmp/host-boost-headers/boost

      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: 安装 npm 依赖并编译 TypeScript
        run: |
          pnpm install --frozen-lockfile
          npx tsc -b

      - name: 下载并配置 Android NDK (r30-beta1)
        run: |
          mkdir -p $ANDROID_NDK_HOME
          curl -fsSL https://dl.google.com/android/repository/android-ndk-$ANDROID_NDK_VERSION-linux.zip -o ndk.zip
          unzip -q ndk.zip -d /tmp
          mv /tmp/android-ndk-*/* $ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: 解压 Javet SO 分卷
        run: |
          cat libs.7z.001 libs.7z.002 libs.7z.003 > libs.7z
          7z x libs.7z -olibs
          find libs -type f

      - name: 复制对应架构的 SO 到 deps/javet
        run: |
          mkdir -p deps/javet
          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            ARCH_DIR="arm64-v8a"
          else
            ARCH_DIR="x86_64"
          fi
          cp "libs/${ARCH_DIR}/${JAVET_SO_NAME}" "deps/javet/${JAVET_SO_NAME}"
          echo "已复制 libs/${ARCH_DIR}/${JAVET_SO_NAME} -> deps/javet/${JAVET_SO_NAME}"

      - name: 下载 Node.js 头文件
        run: |
          if [ -f scripts/nodejs_select ]; then
            bash scripts/nodejs_select "deps/nodejs/${{ env.NODE_HEADERS }}"
          else
            mkdir -p deps/nodejs
            curl -fsSL https://nodejs.org/download/release/v${{ env.NODE_HEADERS }}/node-v${{ env.NODE_HEADERS }}.tar.gz | tar -xz -C deps/nodejs --strip-components=1
          fi

      - name: 将 Node 头文件复制到各子包预期位置
        run: |
          mkdir -p packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/
          mkdir -p packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}
          cp -r deps/nodejs/${{ env.NODE_HEADERS }}/* packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/

      - name: 准备 V8 头文件（补全缺失的 v8-gn.h）
        run: |
          touch deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/nodejs/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h
          touch packages/third_party/v8/deps/nodejs/${{ env.NODE_HEADERS }}/include/node/v8-gn.h

      - name: 修复源码（bits/stdc++.h、模块结构、语法修复、timer.cc 占位）
        shell: bash
        run: |
          echo "修复源码..."
          find packages -name '*.cc' -exec sed -i '/^import std;$/d' {} \;
          NDK_CXX_HEADERS="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/c++/v1"
          mkdir -p "${NDK_CXX_HEADERS}/bits"
          cat > "${NDK_CXX_HEADERS}/bits/stdc++.h" << 'STD_HEADER'
          #include <cstdlib>
          #include <cstdint>
          #include <cstddef>
          #include <cstring>
          #include <cwchar>
          #include <cstdio>
          #include <cassert>
          #include <algorithm>
          #include <array>
          #include <chrono>
          #include <concepts>
          #include <condition_variable>
          #include <deque>
          #include <exception>
          #include <forward_list>
          #include <functional>
          #include <initializer_list>
          #include <iomanip>
          #include <iostream>
          #include <iterator>
          #include <limits>
          #include <list>
          #include <map>
          #include <memory>
          #include <mutex>
          #include <new>
          #include <numeric>
          #include <optional>
          #include <queue>
          #include <random>
          #include <ratio>
          #include <set>
          #include <shared_mutex>
          #include <span>
          #include <sstream>
          #include <stack>
          #include <stdexcept>
          #include <stop_token>
          #include <string>
          #include <string_view>
          #include <source_location>
          #include <tuple>
          #include <type_traits>
          #include <unordered_map>
          #include <unordered_set>
          #include <utility>
          #include <variant>
          #include <vector>
          #include <cmath>
          #include <compare>
          #include <ranges>
          #include <bit>
          #include <version>
          STD_HEADER
          sed -i -E '/auto[[:space:]]*\[\.\.\.[[:space:]]*args[[:space:]]*\][[:space:]]*=[[:space:]]*std::move\(args_\);/d' packages/utility/functional/elide.cc
          sed -i 's/std::move(args)\.\.\./std::forward<Args>(args_).../g' packages/utility/functional/elide.cc
          sed -i -E '/const auto \[\.\.\. indices \]/s/\[\.\.\. indices \]/[...indices]/' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:meta\.algorithm;$/a\import :type_traits.type_pack;' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:meta\.algorithm;$/a\import :utility;' packages/utility/meta/algorithm.cc
          sed -i '/^export module util:utility\.variant;$/a\import :type_traits.transform;' packages/utility/utility/variant.cc

          for f in $(grep -rl 'module ' packages/); do
            sed -i '/^#include <bits\/stdc++.h>$/d' "$f"
            sed -i '/^module;$/d' "$f"
            sed -i '1i\module;' "$f"
            sed -i '2i\#include <bits/stdc++.h>' "$f"
          done

          for f in $(find packages -name '*.cc' -exec grep -LE '(?:export\s+)?module\s' {} \;); do
            sed -i '/^#include <bits\/stdc++.h>$/d' "$f"
            sed -i '1i\#include <bits/stdc++.h>' "$f"
          done

          cat > packages/utility/platform/timer.cc << 'TIMER_EOF'
          module;
          #include <bits/stdc++.h>
          export module util:platform.timer;
          import :functional;
          import :platform.lockable;

          namespace util {
              struct timer_thread {
                  timer_thread() {}
                  void request_stop() {}
                  void join() {}
              };
          }
          TIMER_EOF

      - name: 混合编译（硬编码 utility + 自动扫描其余模块）
        working-directory: ${{ github.workspace }}
        shell: python3 {0}
        run: |
          import os, subprocess, re, glob, collections

          SRC_ROOT = os.getcwd()
          BUILD_DIR = os.path.join(SRC_ROOT, "build")
          NDK_HOME = "/tmp/android-ndk"
          CLANGXX = NDK_HOME + "/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          TARGET = "${{ matrix.triplet }}${{ matrix.ndk_api }}"
          SYSROOT = NDK_HOME + "/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NODE_DIR = f"/tmp/node-v{os.environ['NODE_HEADERS']}"

          BASE_FLAGS = f"--target={TARGET} --sysroot={SYSROOT} -std=gnu++26 -fPIC -fvisibility=hidden " \
                       f"-isystem /tmp/host-boost-headers " \
                       f"-isystem {SRC_ROOT}/packages/utility/include " \
                       f"-I {NODE_DIR}/src " \
                       f"-I {NODE_DIR}/deps/v8/include " \
                       f"-I {NODE_DIR}/deps/uv/include " \
                       f"-I {NODE_DIR}/include/node " \
                       f"-isystem {SRC_ROOT}/packages/auto_js/napi/include " \
                       f"-isystem {SRC_ROOT}/packages/backend_napi_v8/runtime " \
                       f"-DEXPORT_IS_EXPORT -DNAPI_VERSION=10 -O3 -DNDEBUG"

          OBJ_DIR = os.path.join(BUILD_DIR, "objs")
          os.makedirs(OBJ_DIR, exist_ok=True)
          compiled = {}

          UTIL_DIR = os.path.join(SRC_ROOT, "packages/utility")

          def cc_util(rel, part=None, deps=[]):
              src = os.path.join(UTIL_DIR, rel)
              pcm = os.path.join(OBJ_DIR, f"util-{part}.pcm") if part else None
              obj = os.path.join(OBJ_DIR, f"util_{os.path.relpath(src, UTIL_DIR).replace('/', '_')}")
              extra = [f"-fmodule-file={name}={path}" for name, path in compiled.items()]
              for d in deps:
                  if d in compiled:
                      extra.append(f"-fmodule-file={d}={compiled[d]}")
              if pcm:
                  cmd = [CLANGXX] + BASE_FLAGS.split() + ["-c", "-Xclang", "-emit-module-interface", src, "-o", pcm] + extra
                  print(f"PCM: util:{part}")
                  subprocess.run(cmd, check=True)
                  compiled[f"util:{part}"] = pcm
              cmd = [CLANGXX] + BASE_FLAGS.split() + ["-c", src, "-o", obj] + extra
              subprocess.run(cmd, check=True)

          # 硬编码 utility 编译顺序（已验证）
          cc_util("type_traits/transform.cc", "type_traits.transform")
          cc_util("type_traits/type_of.cc", "type_traits.type_of")
          cc_util("functional/elide.cc", "functional.elide")
          cc_util("functional/flat_tuple.cc", "functional.flat_tuple")
          cc_util("memory/comparator.cc", "memory.comparator")
          cc_util("memory/noinit_allocator.cc", "memory.noinit_allocator")
          cc_util("container/mutable_priority_queue.cc", "container.mutable_priority_queue")
          cc_util("container/segmented_priority_queue.cc", "container.segmented_priority_queue")
          cc_util("container/tinker_queue.cc", "container.tinker_queue")
          cc_util("utility/constant_wrapper.cc", "utility.constant_wrapper")
          cc_util("utility/facade.cc", "utility.facade")
          cc_util("utility/hash.cc", "utility.hash")
          cc_util("utility/ranges.cc", "utility.ranges")
          cc_util("platform/timer.h.cc", "platform.timer")
          cc_util("type_traits/type_pack.cc", "type_traits.type_pack")
          cc_util("type_traits/function_traits.cc", "type_traits.function_traits")
          cc_util("utility/string.cc", "utility.string")
          cc_util("type_traits/type_traits.cc", "type_traits", deps=["util:type_traits.type_pack","util:type_traits.function_traits","util:type_traits.type_of","util:type_traits.transform"])
          cc_util("utility/covariant_value.cc", "utility.covariant_value")
          cc_util("utility/utility.cc", "utility", deps=["util:utility.covariant_value","util:utility.facade","util:utility.hash","util:utility.ranges","util:utility.string","util:utility.constant_wrapper"])
          cc_util("memory/autorelease_pool.cc", "memory.autorelease_pool")
          cc_util("memory/memory.cc", "memory", deps=["util:memory.autorelease_pool","util:memory.comparator","util:memory.noinit_allocator"])
          cc_util("functional/function_ref.cc", "functional.function_ref")
          cc_util("functional/function_constant.cc", "functional.function_constant")
          cc_util("functional/regular_return.cc", "functional.regular_return")
          cc_util("functional/bind.cc", "functional.bind")
          cc_util("functional/functional.cc", "functional", deps=["util:functional.bind","util:functional.elide","util:functional.function_constant","util:functional.function_ref","util:functional.regular_return"])
          cc_util("platform/lockable.cc", "platform.lockable")
          cc_util("platform/stop_token.cc", "platform.stop_token")
          cc_util("container/sealed_map.cc", "container.sealed_map")
          cc_util("meta/algorithm.cc", "meta.algorithm")
          cc_util("utility/variant.cc", "utility.variant")

          src = os.path.join(UTIL_DIR, "_module.cc")
          pcm = os.path.join(OBJ_DIR, "util.pcm")
          extra = [f"-fmodule-file={name}={path}" for name, path in compiled.items()]
          cmd = [CLANGXX] + BASE_FLAGS.split() + ["-c", "-Xclang", "-emit-module-interface", src, "-o", pcm] + extra
          subprocess.run(cmd, check=True)
          compiled["util"] = pcm

          src = os.path.join(UTIL_DIR, "platform/timer.cc")
          obj = os.path.join(OBJ_DIR, "util_platform_timer.o")
          subprocess.run([CLANGXX] + BASE_FLAGS.split() + ["-c", src, "-o", obj] + extra, check=True)

          print("utility 模块编译完成，开始自动扫描剩余模块...")

          cc_files = []
          for root, dirs, files in os.walk(os.path.join(SRC_ROOT, "packages")):
              dirs[:] = [d for d in dirs if d not in ("node_modules", "test", "tests", "deps", "benchmark", "utility")]
              for f in files:
                  if f.endswith(".cc"):
                      cc_files.append(os.path.join(root, f))

          module_sources = collections.defaultdict(list)
          imports_map = collections.defaultdict(list)
          all_modules = set()

          for fpath in cc_files:
              with open(fpath, "r", errors="ignore") as f:
                  content = f.read()
              exported = re.findall(r'export module (\S+?);', content)
              if exported:
                  mod = exported[0]
                  all_modules.add(mod)
                  module_sources[mod].append(fpath)
                  imports = re.findall(r'import (\S+?);', content)
                  for imp in imports:
                      if imp.startswith(":"):
                          full = f"{mod}{imp}"
                          imports_map[mod].append(full)
                      else:
                          imports_map[mod].append(imp)

          def compile_module(mod_name):
              if mod_name in compiled:
                  return
              for dep in imports_map.get(mod_name, []):
                  if dep in all_modules and dep not in compiled:
                      compile_module(dep)
              src = module_sources[mod_name][0]
              pcm = os.path.join(OBJ_DIR, f"{mod_name.replace(':', '-')}.pcm")
              obj = os.path.join(OBJ_DIR, f"{os.path.relpath(src, SRC_ROOT).replace('/', '_')}.o")
              extra = [f"-fmodule-file={name}={path}" for name, path in compiled.items()]
              cmd_pcm = [CLANGXX] + BASE_FLAGS.split() + ["-c", "-Xclang", "-emit-module-interface", src, "-o", pcm] + extra
              print(f"PCM: {mod_name}")
              subprocess.run(cmd_pcm, check=True)
              compiled[mod_name] = pcm
              cmd_obj = [CLANGXX] + BASE_FLAGS.split() + ["-c", src, "-o", obj] + extra
              subprocess.run(cmd_obj, check=True)

          for mod in sorted(all_modules):
              compile_module(mod)

          mod_files = set()
          for fl in module_sources.values():
              mod_files.update(fl)
          for fpath in cc_files:
              if fpath not in mod_files:
                  obj = os.path.join(OBJ_DIR, f"{os.path.relpath(fpath, SRC_ROOT).replace('/', '_')}.o")
                  extra = [f"-fmodule-file={name}={path}" for name, path in compiled.items()]
                  cmd = [CLANGXX] + BASE_FLAGS.split() + ["-c", fpath, "-o", obj] + extra
                  subprocess.run(cmd, check=True)

          print("正在链接...")
          objs = glob.glob(os.path.join(OBJ_DIR, "*.o"))
          link_cmd = [CLANGXX] + BASE_FLAGS.split() + objs + [
              "-shared", "-o", os.path.join(BUILD_DIR, "backend_napi_v8.node"),
              f"{SRC_ROOT}/deps/javet/{os.environ['JAVET_SO_NAME']}",
              "-luv", "-landroid", "-llog", "-lEGL", "-lGLESv2", "-lOpenSLES"
          ]
          subprocess.run(link_cmd, check=True)
          print("构建完成！产物位于 build/backend_napi_v8.node")

      - name: 上传产物
        uses: actions/upload-artifact@v6
        with:
          name: isolated-vm-android-${{ matrix.abi }}
          path: build/backend_napi_v8.node
          if-no-files-found: error
